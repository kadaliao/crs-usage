[project]
name = "crs-usage"
version = "0.2.0"
description = "Query claude-relay-service usage and limits using your local Codex config"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Liao Xingyi" }]
keywords = ["codex", "claude", "claude-relay-service", "usage", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kadaliao/crs-usage"
Repository = "https://github.com/kadaliao/crs-usage"
Issues = "https://github.com/kadaliao/crs-usage/issues"

[project.scripts]
crs-usage = "crs_usage.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crs_usage"]
